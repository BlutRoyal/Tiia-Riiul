<!doctype html>

  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
  <div id="app">
    <main id="view"></main>
    <nav id="nav" aria-label="Menüü">
      <button data-tab="active" class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5a2 2 0 1 1 2 2c-.8.3-2 .9-2 2v.5M12 9.5 3.5 16a1.5 1.5 0 0 0 .9 2.7h15.2a1.5 1.5 0 0 0 .9-2.7L12 9.5"/></svg>

        <span>Arhiiv</span>
      </button>
      <button data-tab="form" class="nav-add" aria-label="Lisa toode">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button data-tab="stats" class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>

        <span>Rohkem</span>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
